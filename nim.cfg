# Use the C runtime allocator instead of Nim's own allocator. Makes it easy to
# swap in jemalloc/mimalloc and lets sanitizers see every allocation.
-d:"useMalloc"

# Keep build artifacts inside the project. Safe to delete; ignored by git.
--nimcache:nimcache

# Incremental compilation (`--ic:on`, Nim 2.4) is not enabled here on purpose.
# In a config file it can reuse stale flags across build modes, so a release
# build may keep the debug sanitizer flags. Pass it on the command line:
#   nim c --ic:on -d:release
# It also needs macros with global `.compileTime` variables to be ported.

# Single thread, or refs not shared between threads:
# - Cycles possible: orc
# - Provably acyclic: arc
# Refs shared between threads:
# - Cycles possible: yrc
# - Provably acyclic: atomicArc
--mm:arc

# Small-string optimization: short strings live inline, avoiding heap
# allocation. Use readRawData/beginStore for bulk access to get full benefit.
--strings:sso


# Optimized build: `-d:release` or `-d:danger`.
@if release or danger:
  # No runtime checks; panics terminate the process instead of unwinding.
  checks:off
  panics:on
  # Link-time optimization across C translation units. Explicit flags are
  # needed because -d:lto is evaluated too late in a config file.
  --passC:"-flto"
  --passL:"-flto"
  # Tune for the build machine. The binary may not run on older CPUs.
  --passC:"-march=native"
# Explicit `-d:debug`: maximum diagnostics, no optimization, native debug info.
@elif debug:
  --verbosity:3
  --opt:"none"
  --debugger:"native"

  @if windows:
    # Keep frame pointers for stack traces.
    --passC:"-fno-omit-frame-pointer"
  @else:
    # AddressSanitizer and UndefinedBehaviorSanitizer.
    --passC:"-fsanitize=address,undefined -fno-omit-frame-pointer"
    --passL:"-fsanitize=address,undefined"
  @end
# Default `nim c` build: normal verbosity, sanitizers on non-Windows.
@else:
  --verbosity:2

  @if windows:
    # Keep frame pointers for stack traces.
    --passC:"-fno-omit-frame-pointer"
  @else:
    # AddressSanitizer and UndefinedBehaviorSanitizer.
    --passC:"-fsanitize=address,undefined -fno-omit-frame-pointer"
    --passL:"-fsanitize=address,undefined"
  @end
@end
